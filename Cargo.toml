[package]
name = "footle"
version = "0.1.0"
authors = ["Geoff Leyland <geoff.leyland@incremental.co.nz>"]
edition = "2024"

[dependencies]
git-version = "0.3.9"
typed-arena = "2.0.2"
enumset = "1.1.14"
bit-set = "0.11"
libc = "0.2"
paste = "1.0.15"
anyhow = "1.0.104"
pico-args = "0.5.0"
seq-macro = "0.3.6"
typed-index-collections = "3.5.0"
derive_more = { version = "2", features = ["from", "into", "display"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
capstone = { version = "0.14", default-features = false, features = ["full", "std", "arch_arm64"], optional = true }

[target.'cfg(target_arch = "riscv64")'.dependencies]
capstone = { version = "0.14", default-features = false, features = ["full", "std", "arch_riscv"], optional = true }

[features]
dogfood = ["dep:capstone"]

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -2 }
enum_glob_use = "allow"
missing_const_for_fn = "allow"
wildcard_imports = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
